<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Recorder connection test</title>
</head>
  <button type="button" id="test-mic">Test microphone</button>
<p id="mic-test-status" role="status"></p>

<script>
  document.getElementById('test-mic').addEventListener('click', async () => {
    const status = document.getElementById('mic-test-status');
    status.textContent = 'Waiting for microphone permission…';

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(track => track.stop());
      status.textContent = 'Microphone access works.';
    } catch (error) {
      status.textContent = `${error.name}: ${error.message}`;
    }
  });
</script>
<body>
  <button id="send" type="button">Send test message</button>
  <p id="status" role="status"></p>

  <script>
    const params = new URLSearchParams(location.hash.slice(1));
    const appOrigin = params.get('appOrigin');
    const testId = params.get('testId');
    const status = document.getElementById('status');

    document.getElementById('send').addEventListener('click', () => {
      if (!window.opener || !appOrigin || !testId) {
        status.textContent = 'Open this page using the test button in step 3.';
        return;
      }

      window.opener.postMessage({ type: 'recorder-test', testId }, appOrigin);
      status.textContent = 'Message sent. Check the assessment tab.';
    });
  </script>
</body>
</html>
